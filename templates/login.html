{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}
<div class="card narrow">
    <h1>Log In</h1>
    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Log In</button>
    </form>
    <p class="muted"><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
    <p class="muted">
        No account?
        <a href="{{ url_for('signup', role='inspector') }}">Sign up as Municipal Inspector</a>
        or
        <a href="{{ url_for('signup', role='installer') }}">Sign up as Installer</a>
    </p>
</div>
{% endblock %}
